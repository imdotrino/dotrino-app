# XcodeGen → `xcodegen generate` crea Dotrino.xcodeproj en la Mac (el .xcodeproj no se commitea).
#
#   cd ios && xcodegen generate
#   xcodebuild -project Dotrino.xcodeproj -scheme Dotrino -destination 'platform=iOS Simulator,name=iPhone 16' test
#
# Firma: equipo DOTRINO S.A.S. (P7G853375S), automática. Para un iPhone:
#   xcodebuild … -destination 'platform=iOS,name=Dotrino Phone' -allowProvisioningUpdates build
name: Dotrino
options:
  bundleIdPrefix: com.dotrino
  deploymentTarget:
    iOS: "16.4"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: P7G853375S
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 0.4.8
    CURRENT_PROJECT_VERSION: 1
packages:
  # La librería nativa del ecosistema (repo dotrino-native): cripto, cable, cuentas, almacén.
  DotrinoNative:
    url: https://github.com/imdotrino/dotrino-native
    from: 0.26.0
targets:
  Dotrino:
    type: application
    platform: iOS
    sources: [Dotrino, Shared]
    dependencies:
      # La extensión que hace que el aviso diga el porqué (se incrusta en la app).
      - target: NotificationService
      - package: DotrinoNative
      # Las pantallas del ecosistema en SwiftUI (barra, idioma): las mismas que usa padel.
      - package: DotrinoNative
        product: DotrinoNativeUI
    info:
      path: Dotrino/Info.plist
      properties:
        CFBundleDisplayName: Dotrino
        # La versión la ponen MARKETING_VERSION / CURRENT_PROJECT_VERSION (arriba); sin esto XcodeGen
        # escribe «1.0» y App Store Connect la muestra así.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Solo el cifrado del propio sistema (CryptoKit, Security, WebKit): exento de la
        # documentación de exportación. Así TestFlight no lo pregunta en cada build.
        ITSAppUsesNonExemptEncryption: false
        CFBundleDevelopmentRegion: es
        CFBundleLocalizations: [es, en]
        UILaunchScreen:
          UIColorName: ""
        NSCameraUsageDescription: "Para escanear el código de emparejamiento de tu bóveda."
        # Presence (dotrino-native): antes de aprobar un pedido, el teléfono confirma que eres tú.
        NSFaceIDUsageDescription: "Para confirmar que eres tú antes de aprobar un pedido, si lo activas."
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # iPad: App Store exige las cuatro para la multitarea (error 90474 al subir sin ellas).
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIUserInterfaceStyle: Dark
    # EL PERFIL SE COMPARTE entre las apps de Dotrino del teléfono (dotrino-native/docs/DISENO.md
    # §2.1): mismas llaves (Keychain Access Group) y mismos archivos (App Group).
    entitlements:
      path: Dotrino/Dotrino.entitlements
      properties:
        keychain-access-groups: ["$(AppIdentifierPrefix)com.dotrino.shared"]
        com.apple.security.application-groups: [group.com.dotrino]
        # El timbre (APNs). `development` aquí; la exportación a TestFlight/App Store lo
        # cambia a `production`, y DotrinoPush lee cuál lleva la build.
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dotrino.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # EL AVISO DICE EL PORQUÉ: iOS la despierta al llegar el timbre (APNs con `mutable-content`),
  # baja los pedidos con las llaves y cuentas COMPARTIDAS de la app y reescribe la alerta.
  # Mismo llavero y mismo App Group que la app: sin ellos no ve ni cuentas ni llaves.
  NotificationService:
    type: app-extension
    platform: iOS
    sources:
      - NotificationService
      - Shared
      # Los textos son los de la app: una sola copia.
      - path: Dotrino/es.lproj
      - path: Dotrino/en.lproj
    dependencies:
      - package: DotrinoNative
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: Dotrino
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: es
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: NotificationService/NotificationService.entitlements
      properties:
        keychain-access-groups: ["$(AppIdentifierPrefix)com.dotrino.shared"]
        com.apple.security.application-groups: [group.com.dotrino]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dotrino.app.NotificationService
        TARGETED_DEVICE_FAMILY: "1,2"

  # Lo que necesita un llavero de verdad (llaves, cuentas, almacén): alojado en la app.
  DotrinoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [DotrinoTests]
    dependencies:
      - target: Dotrino
      - package: DotrinoNative
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Dotrino.app/Dotrino"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Dotrino:
    build:
      targets:
        Dotrino: all
    test:
      targets: [DotrinoTests]
