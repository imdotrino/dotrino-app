# XcodeGen → `xcodegen generate` crea Dotrino.xcodeproj en la Mac (el .xcodeproj no se commitea).
#
#   cd ios && xcodegen generate
#   xcodebuild -project Dotrino.xcodeproj -scheme Dotrino -destination 'platform=iOS Simulator,name=iPhone 16' test
#
# Firma: equipo DOTRINO S.A.S. (P7G853375S), automática. Para un iPhone:
#   xcodebuild … -destination 'platform=iOS,name=Dotrino Phone' -allowProvisioningUpdates build
# Todavía sin `aps-environment` (push): falta que el proxio timbre por APNs. Ver el README.
name: Dotrino
options:
  bundleIdPrefix: com.dotrino
  deploymentTarget:
    iOS: "16.4"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: P7G853375S
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 0.3.0
    CURRENT_PROJECT_VERSION: 1
targets:
  # La cripto y el cable: puerto de `android/dotrino-native` (mismos formatos, mismas pruebas).
  DotrinoNative:
    type: framework
    platform: iOS
    sources: [DotrinoNative]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dotrino.native
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  Dotrino:
    type: application
    platform: iOS
    sources: [Dotrino]
    dependencies:
      - target: DotrinoNative
    info:
      path: Dotrino/Info.plist
      properties:
        CFBundleDisplayName: Dotrino
        CFBundleDevelopmentRegion: es
        CFBundleLocalizations: [es, en]
        UILaunchScreen:
          UIColorName: ""
        NSCameraUsageDescription: "Para escanear el código de emparejamiento de tu bóveda."
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIUserInterfaceStyle: Dark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dotrino.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  DotrinoNativeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - DotrinoNativeTests
      # Los MISMOS vectores de oro que prueba Android: un solo archivo, sacado del pilar JS.
      - path: ../android/dotrino-native/src/test/resources/vectors.json
        buildPhase: resources
    dependencies:
      - target: Dotrino
      - target: DotrinoNative
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # Alojadas en la app: es lo que les da un llavero en el simulador.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Dotrino.app/Dotrino"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Dotrino:
    build:
      targets:
        Dotrino: all
    test:
      targets: [DotrinoNativeTests]
